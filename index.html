<!doctype html>
<html lang="en" data-theme="walima">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Wedding Invitation</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="color-scheme" content="only light">
  <meta name="theme-color" content="#f4efe3">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,400&family=Amiri&display=swap">
  <link rel="stylesheet" href="assets/style.css?v=202611132043">
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
  <style>
    main { min-height: 100svh; display: grid; place-items: center; text-align: center; padding: var(--gutter); }
    .display { font-size: clamp(2.4rem, 10vw, 3.4rem); margin: 1rem 0; }
  </style>
</head>
<body>
  <!-- Deliberately lists no events: each guest only gets the link(s) for the event(s) they're invited to. -->
  <main>
    <div>
      <p class="arabic" style="font-size:1.6rem;color:var(--accent);margin:0" lang="ar">بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ</p>
      <h1 class="display">You are invited</h1>
      <p class="muted">Please open the personal link shared with you to view your invitation.</p>
    </div>
  </main>
</body>
</html>
